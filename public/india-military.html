<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>India Military Intelligence Dashboard</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#080d12;--surface:#0f1923;--card:#141f2e;--border:#1e3048;--accent:#1e6eb5;--accent2:#c0392b;--text:#e2e8f0;--muted:#64748b;--green:#22c55e;--yellow:#eab308;--red:#ef4444}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh}
header{background:linear-gradient(135deg,#0a1628 0%,#0f2040 100%);border-bottom:1px solid var(--border);padding:14px 20px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:100}
header .flag{font-size:28px}
header h1{font-size:18px;font-weight:700;color:#fff;letter-spacing:.3px}
header p{font-size:12px;color:var(--muted);margin-top:2px}
.tab-bar{display:flex;gap:4px;padding:12px 16px;background:var(--surface);border-bottom:1px solid var(--border);overflow-x:auto}
.tab-btn{padding:8px 18px;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--muted);font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap;transition:all .2s}
.tab-btn.active{background:var(--accent);border-color:var(--accent);color:#fff}
.tab-btn:hover:not(.active){background:#1a2a3a;color:var(--text)}
#app{padding:16px;max-width:1400px;margin:0 auto}
.controls{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px;align-items:center}
.controls select,.controls input{background:var(--card);border:1px solid var(--border);color:var(--text);padding:8px 12px;border-radius:6px;font-size:13px;outline:none;min-width:150px}
.controls input{flex:1;max-width:320px}
.controls input::placeholder{color:var(--muted)}
.cat-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.chip{padding:5px 12px;border-radius:20px;border:1px solid var(--border);background:var(--card);color:var(--muted);font-size:12px;cursor:pointer;transition:all .15s;white-space:nowrap}
.chip.active{border-color:currentColor;font-weight:600}
.chip[data-cat="all"].active{color:#60a5fa;border-color:#60a5fa;background:#0f2040}
.chip[data-cat="army"].active{color:#86efac;border-color:#16a34a;background:#052e16}
.chip[data-cat="navy"].active{color:#93c5fd;border-color:#1d4ed8;background:#0d1f3c}
.chip[data-cat="airforce"].active{color:#a5b4fc;border-color:#4f46e5;background:#1e1b4b}
.chip[data-cat="drdo"].active{color:#6ee7b7;border-color:#059669;background:#022c22}
.chip[data-cat="geopolitics"].active{color:#d8b4fe;border-color:#7c3aed;background:#2e1065}
.chip[data-cat="operations"].active{color:#fca5a5;border-color:#dc2626;background:#3b0f0f}
.chip[data-cat="equipment"].active{color:#fcd34d;border-color:#d97706;background:#2d1800}
.chip[data-cat="cyber"].active{color:#67e8f9;border-color:#0891b2;background:#0c2433}
.chip[data-cat="policy"].active{color:#d1d5db;border-color:#6b7280;background:#1f2937}
.chip[data-cat="personnel"].active{color:#fde68a;border-color:#d97706;background:#2d1f00}
.spending-section{margin-bottom:20px;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px}
.spending-section h3{font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:12px}
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.bar-label{width:140px;font-size:12px;color:var(--text);text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-track{flex:1;height:12px;background:#0a1628;border-radius:4px;overflow:hidden}
.bar-fill{height:100%;background:linear-gradient(90deg,#1e6eb5,#3b9de8);border-radius:4px;transition:width .6s ease}
.bar-val{width:60px;font-size:11px;color:var(--muted)}
.weapons-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.weapon-card{background:var(--card);border:1px solid var(--border);border-radius:10px;overflow:hidden;display:flex;flex-direction:column}
.weapon-img{width:100%;height:160px;object-fit:cover;background:#0a1628}
.weapon-img-placeholder{width:100%;height:80px;background:linear-gradient(135deg,#0f2040,#0a1628);display:flex;align-items:center;justify-content:center;font-size:28px}
.weapon-body{padding:12px;flex:1;display:flex;flex-direction:column;gap:6px}
.weapon-header{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.status-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.weapon-cat{font-size:10px;color:var(--muted);background:#0a1628;padding:2px 7px;border-radius:10px}
.weapon-year{font-size:10px;color:var(--muted);margin-left:auto}
.weapon-name{font-size:15px;font-weight:700;color:#fff}
.weapon-mfr{font-size:11px;color:var(--muted)}
.weapon-desc{font-size:12px;color:#94a3b8;line-height:1.5}
.weapon-nations{font-size:11px;color:var(--muted)}
.weapon-specs{width:100%;border-collapse:collapse;margin-top:4px}
.weapon-specs td{font-size:11px;padding:2px 0}
.weapon-specs td:first-child{color:var(--muted);width:48%;padding-right:6px}
.weapon-specs td:last-child{color:#cbd5e1;font-weight:500}
.weapon-wiki{display:inline-block;margin-top:8px;font-size:11px;color:#60a5fa;text-decoration:none}
.weapon-wiki:hover{text-decoration:underline}
.tweet-feed{display:flex;flex-direction:column;gap:10px}
.tweet-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px;display:flex;gap:12px}
.tweet-avatar{width:40px;height:40px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;flex-shrink:0;color:#fff;text-transform:uppercase}
.tweet-body{flex:1;min-width:0}
.tweet-header{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.tweet-name{font-size:14px;font-weight:600;color:#fff}
.tweet-handle{font-size:12px;color:var(--muted)}
.tweet-time{font-size:11px;color:var(--muted);margin-left:auto}
.tweet-text{font-size:13px;color:#cbd5e1;line-height:1.6;margin-bottom:8px;word-break:break-word}
.tweet-cats{display:flex;flex-wrap:wrap;gap:4px}
.tweet-cat-badge{font-size:10px;padding:2px 8px;border-radius:10px;font-weight:500}
.tweet-link{font-size:11px;color:#60a5fa;text-decoration:none;margin-left:auto;flex-shrink:0}
.tweet-link:hover{text-decoration:underline}
.tweet-footer{display:flex;align-items:center;gap:8px;margin-top:6px}
.loading{text-align:center;padding:40px;color:var(--muted);font-size:14px}
.loading-spinner{display:inline-block;width:24px;height:24px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite;margin-bottom:12px}
@keyframes spin{to{transform:rotate(360deg)}}
.error-box{background:#1a0a0a;border:1px solid #7f1d1d;border-radius:10px;padding:20px;text-align:center;color:#fca5a5}
.error-box h3{font-size:15px;margin-bottom:8px}
.error-box p{font-size:12px;color:var(--muted);line-height:1.5}
.info-box{background:#0c1a2e;border:1px solid #1d4ed8;border-radius:10px;padding:16px;margin-bottom:16px;font-size:12px;color:#93c5fd;line-height:1.6}
.info-box strong{color:#60a5fa}
.badge-count{background:#1e3a5f;color:#60a5fa;font-size:10px;padding:1px 6px;border-radius:8px;margin-left:4px}
.refresh-btn{margin-left:auto;padding:7px 14px;background:var(--card);border:1px solid var(--border);color:var(--text);border-radius:6px;cursor:pointer;font-size:12px}
.refresh-btn:hover{border-color:var(--accent);color:var(--accent)}
.last-updated{font-size:11px;color:var(--muted)}
.progress-bar{height:3px;background:var(--border);border-radius:2px;margin-bottom:16px;overflow:hidden}
.progress-fill{height:100%;background:var(--accent);transition:width .3s ease;border-radius:2px}
@media(max-width:600px){.weapons-grid{grid-template-columns:1fr}.bar-label{width:90px;font-size:11px}}
</style>
</head>

function classifyTweet(text) {
  const lower = text.toLowerCase();
  const scores = {};
  for (const [key, cat] of Object.entries(CATS)) {
    let score = 0;
    for (const kw of cat.kw) {
      if (lower.includes(kw.toLowerCase())) score += kw.length > 8 ? 2 : 1;
    }
    if (score > 0) scores[key] = score;
  }
  const sorted = Object.entries(scores).sort((a,b) => b[1]-a[1]);
  return sorted.slice(0,3).map(([k]) => k);
}

// ── INDIA DEFENCE FEED ────────────────────────────────────────────────────────
const NITTER_INSTANCES = ['https://nitter.privacydev.net','https://nitter.poast.org','https://nitter.1d4.us','https://nitter.tiekoetter.com'];
const CORS_PROXIES = ['https://corsproxy.io/?','https://api.allorigins.win/get?url='];
let nitterIdx = 0, proxyIdx = 0;

async function fetchRss(handle) {
  for (let pi = 0; pi < CORS_PROXIES.length; pi++) {
    for (let ni = 0; ni < NITTER_INSTANCES.length; ni++) {
      const nitter = NITTER_INSTANCES[(nitterIdx+ni)%NITTER_INSTANCES.length];
      const rssUrl = `${nitter}/${handle}/rss`;
      const proxy = CORS_PROXIES[(proxyIdx+pi)%CORS_PROXIES.length];
      try {
        const url = proxy === 'https://api.allorigins.win/get?url=' ? `${proxy}${encodeURIComponent(rssUrl)}` : `${proxy}${encodeURIComponent(rssUrl)}`;
        const res = await fetch(url, { signal: AbortSignal.timeout(8000) });
        if (!res.ok) continue;
        const data = await res.json();
        const xml = proxy.includes('allorigins') ? data.contents : data;
        if (!xml || typeof xml !== 'string') continue;
        const items = parseRss(xml, handle);
        if (items.length > 0) { nitterIdx = (nitterIdx+ni)%NITTER_INSTANCES.length; return items; }
      } catch { continue; }
    }
  }
  return [];
}

function parseRss(xml, handle) {
  const items = [];
  const itemRe = /<item>([\s\S]*?)<\/item>/g;
  let m;
  while ((m = itemRe.exec(xml)) !== null) {
    const chunk = m[1];
    const title = getTag(chunk,'title');
    const link = getTag(chunk,'link');
    const pubDate = getTag(chunk,'pubDate');
    const desc = getTag(chunk,'description') || '';
    const text = stripHtml(desc) || stripHtml(title||'');
    if (!text || text.length < 10) continue;
    const dateMs = pubDate ? new Date(pubDate).getTime() : Date.now();
    if (isNaN(dateMs)) continue;
    const cats = classifyTweet(text);
    items.push({ id: link||Math.random().toString(36), handle, text: text.slice(0,400), url: toTwitterUrl(link, handle), time: dateMs, cats });
  }
  return items;
}

function getTag(xml, tag) {
  const re = new RegExp(`<${tag}[^>]*>(?:<!\\[CDATA\\[)?([\\s\\S]*?)(?:\\]\\]>)?</${tag}>`, 'i');
  const m = re.exec(xml); return m ? m[1].trim() : null;
}
function stripHtml(h) { return (h||'').replace(/<[^>]+>/g,'').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&#39;/g,"'").replace(/\s+/g,' ').trim(); }
function toTwitterUrl(nitterUrl, handle) {
  if (!nitterUrl) return `https://x.com/${handle}`;
  return nitterUrl.replace(/^https?:\/\/[^/]+/, 'https://x.com').replace(/#m$/,'');
}
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function timeAgo(ms) {
  const s = Math.floor((Date.now()-ms)/1000);
  if (s<60) return `${s}s ago`; if (s<3600) return `${Math.floor(s/60)}m ago`;
  if (s<86400) return `${Math.floor(s/3600)}h ago`; return `${Math.floor(s/86400)}d ago`;
}

async function startFeedLoad() {
  isFetching = true;
  renderFeedShell();
  // Direct Nitter RSS via CORS proxy — no backend needed
  updateProgress(0, ACCOUNTS.length);
  for (let i = 0; i < ACCOUNTS.length; i++) {
    const acc = ACCOUNTS[i];
    if (fetchedBatches.has(acc.handle)) continue;
    const items = await fetchRss(acc.handle);
    fetchedBatches.add(acc.handle);
    if (items.length > 0) { allTweets = dedup([...allTweets, ...items]); }
    updateProgress(i+1, ACCOUNTS.length);
    if (i % 5 === 4) renderFeed();
    await new Promise(r => setTimeout(r, 300)); // rate limit
  }
  renderFeed();
  isFetching = false;
}

function dedup(tweets) {
  const seen = new Set();
  return tweets.filter(t => { if (seen.has(t.id)) return false; seen.add(t.id); return true; }).sort((a,b)=>b.time-a.time);
}

function updateProgress(done, total) {
  const bar = document.getElementById('feedProgress');
  if (bar) bar.style.width = `${Math.round(done/total*100)}%`;
  const lbl = document.getElementById('fetchLabel');
  if (lbl) lbl.textContent = `Fetching account ${done}/${total}…`;
}
function renderFeedShell() {
  const sec = document.getElementById('feed-section');
  const catEntries = [['all','All','🔍'],...Object.entries(CATS).map(([k,v])=>[k,v.label,v.icon])];
  sec.innerHTML = `
    <div class="info-box">
      <strong>Live Data Pipeline:</strong> Fetches from ${ACCOUNTS.length} verified Indian defence Twitter/X profiles.
      NLP classifier assigns categories using keyword analysis.<br>
      <strong>Sources:</strong> Nitter RSS via CORS proxy (no backend required) → Real tweets only, zero hallucination.
    </div>
    <div class="cat-chips" id="feedCatChips">
      ${catEntries.map(([k,l,ic])=>`<button class="chip${feedCat===k?' active':''}" data-cat="${k}" onclick="feedCat='${k}';renderFeed()">${ic} ${l}</button>`).join('')}
    </div>
    <div class="controls">
      <select onchange="feedSearch='';document.getElementById('feedSearchInput').value='';renderFeed()">
        <option value="">All Sources</option>
        ${ACCOUNTS.map(a=>`<option value="${a.handle}">@${a.handle}</option>`).join('')}
      </select>
      <input id="feedSearchInput" type="text" placeholder="Search tweets…" oninput="feedSearch=this.value;renderFeed()">
      <button class="refresh-btn" onclick="allTweets=[];fetchedBatches=new Set();startFeedLoad()">↻ Refresh</button>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="feedProgress" style="width:0%"></div></div>
    <div id="fetchLabel" style="font-size:11px;color:var(--muted);margin-bottom:10px">Loading tweets…</div>
    <div id="tweetList"><div class="loading"><div class="loading-spinner"></div><br>Connecting to data sources…</div></div>`;
}

function renderFeed() {
  const list = document.getElementById('tweetList');
  if (!list) return;
  const lbl = document.getElementById('fetchLabel');
  // Re-render chips with updated counts
  const chipContainer = document.getElementById('feedCatChips');
  if (chipContainer) {
    const catEntries = [['all','All','🔍'],...Object.entries(CATS).map(([k,v])=>[k,v.label,v.icon])];
    chipContainer.innerHTML = catEntries.map(([k,l,ic]) => {
      const count = k==='all' ? allTweets.length : allTweets.filter(t=>t.cats.includes(k)).length;
      return `<button class="chip${feedCat===k?' active':''}" data-cat="${k}" onclick="feedCat='${k}';renderFeed()">${ic} ${l}<span class="badge-count">${count}</span></button>`;
    }).join('');
  }
  const filtered = allTweets.filter(t => {
    if (feedCat !== 'all' && !t.cats.includes(feedCat)) return false;
    if (feedSearch) { const q=feedSearch.toLowerCase(); if (!t.text.toLowerCase().includes(q)&&!t.handle.toLowerCase().includes(q)) return false; }
    return true;
  }).slice(0, 100);

  if (lbl) lbl.textContent = allTweets.length > 0 ? `${allTweets.length} tweets loaded from ${fetchedBatches.size} accounts` : 'Loading…';

  if (allTweets.length === 0) {
    list.innerHTML = `<div class="loading"><div class="loading-spinner"></div><br>Fetching live tweets…</div>`; return;
  }
  if (filtered.length === 0) {
    list.innerHTML = `<div class="loading">No tweets match the current filter.</div>`; return;
  }
  list.innerHTML = `<div class="tweet-feed">${filtered.map(renderTweetCard).join('')}</div>`;
}

function renderTweetCard(t) {
  const acc = ACCOUNTS.find(a=>a.handle===t.handle)||{handle:t.handle,name:t.handle};
  const avatar = acc.handle.slice(0,2).toUpperCase();
  const catBadges = (t.cats||[]).map(c => {
    const cat = CATS[c]; if (!cat) return '';
    return `<span class="tweet-cat-badge" style="background:${cat.bg};color:${cat.color}">${cat.icon} ${cat.label}</span>`;
  }).join('');
  const name = acc.name || acc.handle;
  return `<div class="tweet-card">
    <div class="tweet-avatar">${avatar}</div>
    <div class="tweet-body">
      <div class="tweet-header">
        <span class="tweet-name">${esc(name)}</span>
        <span class="tweet-handle">@${esc(t.handle)}</span>
        <span class="tweet-time">${timeAgo(t.time)}</span>
      </div>
      <div class="tweet-text">${esc(t.text)}</div>
      <div class="tweet-footer">
        <div class="tweet-cats">${catBadges||'<span style="font-size:11px;color:var(--muted)">General</span>'}</div>
        <a class="tweet-link" href="${t.url}" target="_blank" rel="noopener">View →</a>
      </div>
    </div>
  </div>`;
}
